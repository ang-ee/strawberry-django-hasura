name: checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy strawberry_django_hasura
      - run: uv build
      - name: Install and exercise the built wheel with published dependencies
        run: |
          uv venv /tmp/sdh-wheel --python 3.14
          uv pip install --python /tmp/sdh-wheel/bin/python dist/*.whl
          cp scripts/smoke_wheel.py /tmp/sdh-wheel/smoke_wheel.py
          cd /tmp/sdh-wheel
          bin/python -I smoke_wheel.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sdh_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SDH_TEST_POSTGRES: '1'
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sdh_tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest
